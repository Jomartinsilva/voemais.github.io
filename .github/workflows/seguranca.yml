name: Seguranca do site

# Roda a cada push na main, em pull requests e toda segunda-feira (verificacao periodica).
# Se falhar, o GitHub avisa por e-mail: abra a aba Actions e leia a linha FALHA.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'   # segunda, 06:17 no horario de Brasilia
  workflow_dispatch:

permissions:
  contents: read           # minimo necessario: so le o repositorio

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verificar seguranca
        run: python3 scripts/verificar_seguranca.py
